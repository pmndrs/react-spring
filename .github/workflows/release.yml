name: Release

on:
  push:
    branches:
      - 'next'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}
  cancel-in-progress: false

permissions: {}

jobs:
  release:
    name: 'Release'
    if: github.repository == 'pmndrs/react-spring'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    steps:
      - name: Checkout repo
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup
        with:
          registry-url: 'https://registry.npmjs.org'
          turbo-cache: 'true'

      # npm Trusted Publishing requires npm >= 11.5.1; Node 22 LTS still ships npm 10.x
      - name: Upgrade npm
        run: npm install -g npm@latest

      - name: Build
        run: pnpm build-ci

      - name: Create release PR or publish
        id: changesets
        uses: changesets/action@v2
        with:
          version-script: pnpm vers
          publish-script: pnpm changeset publish
          pr-title: 'chore: version packages'
          commit-message: 'chore: version packages'

      # changesets only tags per package, and skips GitHub releases because CHANGELOG.md is gitignored
      - name: Create GitHub release
        if: steps.changesets.outputs.published == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(jq -r .version packages/core/package.json)
          prerelease=$([[ "$version" == *-* ]] && echo --prerelease || true)
          gh release create "v$version" --target "$GITHUB_SHA" --generate-notes $prerelease
