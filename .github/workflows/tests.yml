name: Tests

on:
  push:
    branches:
      - 'main'
  pull_request: {}

env:
  TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
  TURBO_TEAM: ${{ secrets.TURBO_TEAM }}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  changes:
    name: Check for changes
    runs-on: ubuntu-latest
    outputs:
      packages: ${{ steps.filter.outputs.packages }}
    steps:
      - uses: actions/checkout@v6
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            packages:
              - 'packages/**'
              - 'targets/**'
              - 'tests/**'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'vitest.config.ts'
              - '.github/publish-ci/**/package-lock.json'
              - '.github/workflows/*.yml'
              - 'package.json'
  build:
    needs: changes
    if: ${{ needs.changes.outputs.packages == 'true' }}
    name: 'Build'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup node
        uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build-ci --filter=!@react-spring/docs

      - name: Pack
        run: pnpm package

      - uses: actions/upload-artifact@v7
        with:
          name: animated
          path: packages/animated/package.tgz

      - uses: actions/upload-artifact@v7
        with:
          name: core
          path: packages/core/package.tgz

      - uses: actions/upload-artifact@v7
        with:
          name: rafz
          path: packages/rafz/package.tgz

      - uses: actions/upload-artifact@v7
        with:
          name: shared
          path: packages/shared/package.tgz

      - uses: actions/upload-artifact@v7
        with:
          name: types
          path: packages/types/package.tgz

      - uses: actions/upload-artifact@v7
        with:
          name: web
          path: targets/web/package.tgz

  test-unit:
    name: 'Test:unit'
    needs: [build]
    if: ${{ needs.changes.outputs.packages == 'true' }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ['22.x', '24.x']

    steps:
      - name: Checkout repo
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup node ${{ matrix.node }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          cache: 'pnpm'

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build-ci

      - name: Cache Playwright browsers
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Test
        run: pnpm test:unit

  test-types:
    name: 'Test:types with TS ${{ matrix.ts }}'
    needs: [build]
    if: ${{ needs.changes.outputs.packages == 'true' }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        ts: ['5.0', '5.4', '5.7', '5.9', '6.0']

    steps:
      - name: Checkout repo
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup node
        uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Install TypeScript ${{ matrix.ts }}
        run: pnpm add -w typescript@${{ matrix.ts }}

      # tsup's dts plugin injects `baseUrl: "."` unconditionally, which TS 6
      # flags as deprecated. Silence it only for the TS 6 matrix entry —
      # earlier versions reject "6.0" as an invalid value. Track upstream:
      # https://github.com/egoist/tsup/issues/1388
      - name: Patch tsconfig for TS 6.0 dts build
        if: matrix.ts == '6.0'
        run: jq '.compilerOptions.ignoreDeprecations = "6.0"' tsconfig.json > tsconfig.tmp && mv tsconfig.tmp tsconfig.json

      - name: Build
        run: pnpm build-ci

      - name: Test
        run: |
          pnpm tsc --version
          pnpm test:ts

  test-e2e:
    needs: [build]
    if: ${{ needs.changes.outputs.packages == 'true' }}
    name: 'Test:E2E'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup node
        uses: actions/setup-node@v6
        with:
          node-version: '24.x'
          cache: 'pnpm'

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Cache Playwright browsers
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Test
        run: pnpm test:e2e

  test-published-artifact:
    needs: [build]
    if: ${{ needs.changes.outputs.packages == 'true' }}
    name: 'Test:publish'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        example: ['cra5', 'next', 'vite', 'node-standard', 'node-esm']
    defaults:
      run:
        working-directory: ./.github/publish-ci/${{ matrix.example }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v6

      - name: Setup node
        uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
          cache-dependency-path: .github/publish-ci/${{ matrix.example }}/package-lock.json

      - name: Install
        run: npm ci

      - name: Remove existing @react-spring/web
        run: npm uninstall @react-spring/web

      - uses: actions/download-artifact@v8
        with:
          path: ./.github/publish-ci/${{ matrix.example }}

      - name: Check folder contents
        run: ls -l .

      - name: Install RS build artifacts
        run: npm install ./web/package.tgz ./animated/package.tgz ./core/package.tgz ./rafz/package.tgz ./shared/package.tgz ./types/package.tgz

      - name: Show installed RS versions
        run: npm info @react-spring/web && npm ls @react-spring/web

      - name: Build example
        run: npm run build

      - name: Run test step
        run: npm test

  are-the-types-wrong:
    name: Check package config with are-the-types-wrong

    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v6

      - name: Setup node
        uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'

      - uses: actions/download-artifact@v8
        with:
          name: web

      - name: show folder
        run: ls -l .

      - name: Run are-the-types-wrong
        # TODO: unpin once https://github.com/arethetypeswrong/arethetypeswrong.github.io
        # ships a fix for the "Cannot read properties of undefined (reading 'filename')"
        # crash that began in 0.15.x. Pre-migration baseline yarn pack tarballs hit the
        # same crash, so this is unrelated to yarn → pnpm.
        run: npx @arethetypeswrong/cli@0.13.6 ./package.tgz --format table --ignore-rules false-cjs
