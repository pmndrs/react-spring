name: Bundle-size

on:
  pull_request:
    branches:
      - main
permissions:
  contents: read


concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  size:
    permissions:
      contents: read
      pull-requests: write
    name: 'Bundle Size'
    if: github.repository == 'pmndrs/react-spring'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup
        with:
          turbo-cache: 'true'

      - name: Build packages
        run: pnpm build --filter=!@react-spring/docs

      - uses: preactjs/compressed-size-action@f322c295dde06a1cb7ccaef105732dd8a726d1d9 # 2.10.0
        with:
          pattern: '{**/dist/**/*.{mjs,js},packages/types/*.{js,d.ts}}'
