# Plumber overlay: inherits every control from the CLI's built-in
# baseline, only the differences for this repository are written here.
# Run 'plumber config resolve' to see the full effective config.
extends: plumber:default
version: '2.0'

github:
  controls:
    githubActionMustComeFromAuthorizedSources:
      # Keep the curated default list and trust the five actions this
      # repository uses on top of it, all pinned by commit and kept
      # current by Renovate.
      includePlumberDefaults: true
      trustedGithubActions:
        - dorny/paths-filter
        - marocchino/sticky-pull-request-comment
        - mathieudutour/github-tag-action
        - preactjs/compressed-size-action
        - styfle/cancel-workflow-action
